<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} — Адмін</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f4f8; color: #333; }
        .topbar {
            background: #0d47a1; color: white;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 24px; height: 64px;
        }
        .topbar h1 { font-size: 20px; font-weight: 700; }
        .topbar a { color: white; text-decoration: none; font-weight: 600; }
        .container { max-width: 600px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        h2 { color: #0d47a1; margin-bottom: 16px; }
        .row { margin: 10px 0; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .row:last-child { border-bottom: none; }
        .label { font-size: 13px; color: #888; }
        .value { font-size: 15px; margin-top: 4px; }
        .photo { max-width: 200px; border-radius: 8px; margin-top: 8px; }
        .back { display: inline-block; margin-bottom: 16px; color: #0d47a1; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>Адмін панель</h1>
        <a href="/admin">← Назад</a>
    </div>

    <div class="container">
        <a href="/admin" class="back">← До списку</a>
        <div class="card">
            <h2>{{ product.name }}</h2>
            <div class="row">
                <div class="label">Форма</div>
                <div class="value">{{ product.form or '—' }}</div>
            </div>
            <div class="row">
                <div class="label">Об'єм / вага</div>
                <div class="value">{{ product.volume or '—' }}</div>
            </div>
            <div class="row">
                <div class="label">Виробник</div>
                <div class="value">{{ product.manufacturer or '—' }}</div>
            </div>
            <div class="row">
                <div class="label">Опис</div>
                <div class="value">{{ product.description or '—' }}</div>
            </div>
            {% if product.photo %}
            <div class="row">
                <div class="label">Фото</div>
                <img src="{{ product.photo }}" class="photo" alt="">
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
