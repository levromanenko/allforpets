<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Редагування прав</title>
    <style>
        body { font-family: Arial; background:#f8fafc; padding:20px; }
        .box { background:white; max-width:500px; margin:40px auto; padding:24px; border-radius:12px; }
        label { display:block; margin:12px 0; }
        button { background:#0d9488; color:white; border:none; padding:12px 20px; border-radius:8px; cursor:pointer; }
    </style>
</head>
<body>
<div class="box">
    <h2>Права керуючого (ID: {{ manager.user_id }})</h2>
    <form method="post" action="/clinic/update-manager/{{ manager.id }}">
        <label><input type="checkbox" name="can_edit_clinic" {% if manager.can_edit_clinic %}checked{% endif %}> Редагувати дані клініки</label>
        <label><input type="checkbox" name="can_manage_vets" {% if manager.can_manage_vets %}checked{% endif %}> Додавати / редагувати лікарів</label>
        <label><input type="checkbox" name="can_view_schedule" {% if manager.can_view_schedule %}checked{% endif %}> Переглядати розклад лікарів</label>
        <button type="submit">Зберегти</button>
    </form>
    <a href="/clinic/cabinet">Назад</a>
</div>
</body>
</html>
